name: Inspect fridays

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dump Friday rows
        env:
          SCHOOL_ACCOUNT: ${{ secrets.SCHOOL_ACCOUNT }}
          SCHOOL_PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, sys, datetime as dt
          sys.path.insert(0, ".")
          import fetch_ics as f

          uid, session = f.login(os.environ["SCHOOL_ACCOUNT"], os.environ["SCHOOL_PASSWORD"])
          today = dt.datetime.now(f.TZ).date()
          print("today", today, today.strftime("%A"))

          for weeks in range(0, 13):
              day = today - dt.timedelta(weeks=weeks)
              key = day.strftime("%Y%m%d")
              daily = f.post("course/get_stu_course_sched.action", [("id", uid), ("dateStr", key)], session)
              rows = daily.get("result") or []
              names = [str(r.get("courseName")) for r in rows]
              print(key, day.strftime("%a"), "STATUS", daily.get("STATUS"), "rows", len(rows), names)
              for row in rows:
                  if "市场营销" in str(row.get("courseName")):
                      print("     ", row.get("classBeginTime"), "-", row.get("classEndTime"),
                            row.get("teacherName"), row.get("classroomName"), row.get("signStatus"))
          PY
