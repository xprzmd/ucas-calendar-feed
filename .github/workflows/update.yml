name: Update calendar feed

on:
  schedule:
    # UTC 02:23 / 08:23 / 14:23 / 20:23 = Beijing 10:23 / 16:23 / 22:23 / 04:23
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed
        env:
          SCHOOL_ACCOUNT: ${{ secrets.SCHOOL_ACCOUNT }}
          SCHOOL_PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
          FEED_DAYS: "180"
          ALARM_MINUTES: "10"
        run: |
          mkdir -p public
          python3 fetch_ics.py --out public/calendar.ics
          touch public/.nojekyll

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q
          git checkout -q -b gh-pages
          git config user.name "calendar-feed[bot]"
          git config user.email "calendar-feed@users.noreply.github.com"
          echo "$(date -u +%F)" > last-update.txt
          git add calendar.ics .nojekyll last-update.txt
          git commit -qm "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
